[project]
name = "polars-mcp"
version = "0.3.0"
description = "MCP server that introspects the locally installed Polars package, giving agents accurate API signatures and documentation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastmcp>3.0",
    "polars",
]

[project.scripts]
polars-mcp = "polars_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polars_mcp.py"]

[tool.hatch.build.targets.sdist]
include = [
    "polars_mcp.py",
    "README.md",
    "LICENSE",
]
